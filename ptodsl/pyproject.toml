[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pto-dsl"
version = "0.1.0"
description = "Pythonic DSL wrappers for building PTO MLIR modules"
requires-python = ">=3.9"
authors = [
  { name = "pto-dsl contributors" }
]

[tool.setuptools]
packages = ["ptodsl", "ptodsl.examples"]

[tool.setuptools.package-dir]
ptodsl = "."
"ptodsl.examples" = "examples"
